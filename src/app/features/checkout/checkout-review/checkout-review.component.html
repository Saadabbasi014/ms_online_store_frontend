<div class="mt-4 w-full">
    <h4 class="text-lg font-semibold">Billing and delivery information</h4>
    <dl>
        <dt class="font-medium">Shipping Address</dt>
        <dt class="mt-1 text-gray-500">Shipping Address goes here</dt>
        <dt class="font-medium">Shipping Details</dt>
        <dt class="mt-1 text-gray-500">Shipping Address go here</dt>

    </dl>
</div>

<div class="mt-6 mx-auto">
    <div class="border-b border-gray-200">
        <table class="w-full text-center">
            <tbody class="divide-y divide-gray-200">
                @for (item of cartService.cart()?.items; track $index) {
                <tr>
                    <td class="py-4">
                        <div class="flex item-center gap-4">
                            <img src="{{item.imageUrl}}" alt="product img" class="w-10 h-10">
                            <span>{{item.productName}}</span>
                        </div>
                    </td>
                    <td class="p-4">x{{item.quantity}}</td>
                    <td class="p-4 text-right">{{item.price}}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
