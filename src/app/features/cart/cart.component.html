<section>
  <div class="mx-auto max-w-screen-xl">
    <div class="flex w-full items-start gap-6 mt-32">
      @if (cartService.cart()) {
      <div class="w-3/4">
        @for (item of cartService.cart()?.items; track item.productId) {
        <app-cart-item [item]="item"></app-cart-item>
        }
      </div>

      <div class="w-1/4">
        <app-order-summary></app-order-summary>
      </div>
      }@else {
         <div class="w-full text-center py-20">
          <h2 class="text-2xl font-semibold text-gray-700">Your cart is empty</h2>
          <p class="mt-4 text-gray-500">Looks like you haven’t added anything yet.</p>
          <a routerLink="/shop" class="mt-6 inline-block bg-purple-500 text-white px-6 py-3 rounded hover:bg-purple-700 transition">
            Continue Shopping
          </a>
        </div>
      }

    </div>
  </div>
</section>
